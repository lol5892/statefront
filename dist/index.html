<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#e8e9e7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="description" content="Statefront — стратегия захвата 48 штатов. 30 уровней, игра без интернета."><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"><title>STATEFRONT · Захвати карту</title></head><body>
<main id="app"><header><div class="brand">STATE<span>FRONT</span><small>ЗАХВАТИ КАРТУ</small></div><button id="sound" class="round" aria-label="Включить звук">♪</button><button id="pause" class="round" aria-label="Пауза">Ⅱ</button></header>
<section class="mission"><div><span class="eyebrow" id="chapter">КАМПАНИЯ · ЗАПАД</span><h1 id="levelTitle">Уровень 01</h1></div><button id="levelsBtn" class="chip">30 уровней <span>▦</span></button></section>
<div id="power" class="power"></div><div class="legend"><span><i></i> ВАШИ ШТАТЫ <b id="owned">1 / 48</b></span><span id="timer">0:00</span></div>
<div id="arena"><canvas id="game" aria-label="Карта США. Проведите от синего штата к цели."></canvas><div class="map-caption">UNITED STATES <span>48 TERRITORIES</span></div><div id="toast"></div></div>
<section class="orders"><div class="order-icon">↗</div><div><strong id="hint">Проведите от синего штата к цели</strong><p>Соберите несколько своих штатов одним жестом</p></div></section>
<footer><button id="all" class="primary">Выбрать все <span>↗</span></button><button id="percent" class="secondary">Отправка 80%</button><button id="zoom" class="round" aria-label="Масштаб карты">＋</button></footer><div class="footnote">Удерживайте преимущество. Защищайте свои границы.</div>
</main><div id="modal" class="modal hidden"></div><div id="loading">Загружаем карту…</div><script type="module" src="./main.js"></script></body></html>
