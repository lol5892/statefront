<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#edf1ee"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="description" content="Statefront: 30 локальных операций, крупные территории и тактические сражения."><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"><title>Statefront · Новые фронты</title></head><body>
<main id="app"><header><div class="brand">STATE<span>FRONT</span><small>НОВЫЕ ФРОНТЫ · V3</small></div><button id="restartBtn" class="round" aria-label="Перезапуск операции">↻</button><button id="sound" class="round" aria-label="Включить звук">♪</button><button id="pause" class="round" aria-label="Пауза">Ⅱ</button></header>
<section class="mission"><div><span class="eyebrow" id="chapter">ОПЕРАЦИЯ 01 / 30</span><h1 id="levelTitle">Тихоокеанский рубеж</h1></div><button id="levelsBtn" class="chip" aria-label="Выбрать уровень">▦</button></section>
<div id="power" class="power"></div><div class="legend"><span><i></i> ВАШИ СЕКТОРЫ <b id="owned">1 / 6</b></span><span id="timer">0:00</span></div>
<div id="arena"><canvas id="game" aria-label="Локальная карта боя. Проведите от синего сектора к цели."></canvas><div id="toast" role="status"></div></div>
<div class="map-meta"><span id="mapLabel">6 СЕКТОРОВ · 1 СОПЕРНИК</span><span>ϟ УСКОРЕННЫЙ ПРИРОСТ</span></div>
<section class="orders"><strong id="hint">Проведите от синего сектора к цели</strong><p id="brief">Захватите узел ⚡ — он создаёт войска быстрее.</p></section>
<footer><button id="all" class="primary">Все армии <span>↗</span></button><button id="percent" class="secondary">75% войск</button></footer>
</main><div id="modal" class="modal hidden"></div><div id="loading">Готовим операцию…</div><script type="module" src="./main.js"></script></body></html>
